<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Chatbot</title>

    <style>
        /* Remove default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        /* Main chatbot box */
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 700px;

            display: flex;
            flex-direction: column;

            background-color: white;
            border-radius: 16px;
            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* Chatbot header */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            background-color: #2563eb;
            color: white;
        }

        .chat-header h1 {
            font-size: 20px;
        }

        .chat-header p {
            margin-top: 4px;
            font-size: 12px;
            color: #dbeafe;
        }

        .new-chat-button {
            padding: 8px 12px;

            border: none;
            border-radius: 8px;

            background-color: white;
            color: #2563eb;

            font-weight: bold;
            cursor: pointer;
        }

        .new-chat-button:hover {
            background-color: #eff6ff;
        }

        /* Message display area */
        .chat-messages {
            flex: 1;
            padding: 20px;

            overflow-y: auto;
            background-color: #f8fafc;
        }

        /* Common message style */
        .message {
            max-width: 80%;

            margin-bottom: 16px;
            padding: 12px 14px;

            border-radius: 12px;
            line-height: 1.5;

            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* User message */
        .user-message {
            margin-left: auto;

            background-color: #2563eb;
            color: white;

            border-bottom-right-radius: 4px;
        }

        /* Bot message */
        .bot-message {
            margin-right: auto;

            background-color: white;
            color: #1e293b;

            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        /* Error message */
        .error-message {
            margin-right: auto;

            background-color: #fef2f2;
            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        /* Thinking animation container */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Thinking animation dot */
        .typing-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background-color: #64748b;

            animation: bounce 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        /* Bottom input area */
        .chat-input-area {
            padding: 14px;
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        #messageInput {
            flex: 1;

            min-height: 44px;
            max-height: 120px;

            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            outline: none;
            resize: none;

            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        #sendButton {
            height: 44px;
            padding: 0 18px;

            border: none;
            border-radius: 10px;

            background-color: #2563eb;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:hover {
            background-color: #1d4ed8;
        }

        #sendButton:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .input-help {
            display: flex;
            justify-content: space-between;

            margin-top: 8px;

            color: #64748b;
            font-size: 11px;
        }

        /* Mobile design */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                max-width: none;
                height: 100vh;
                border-radius: 0;
            }

            .chat-header {
                padding: 14px;
            }

            .chat-header h1 {
                font-size: 17px;
            }

            .chat-messages {
                padding: 14px;
            }

            .message {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>

    <!-- Main chatbot container -->
    <div class="chat-container">

        <!-- Chatbot header -->
        <header class="chat-header">
            <div>
                <h1>AI Assistant</h1>

                <p>
                    Node.js, API, Databricks and SQL
                </p>
            </div>

            <button
                type="button"
                class="new-chat-button"
                id="newChatButton"
            >
                New Chat
            </button>
        </header>


        <!-- Messages appear here -->
        <main
            class="chat-messages"
            id="chatMessages"
        >
            <div class="message bot-message">
                Hello! I am your AI assistant. How can I help you?
            </div>
        </main>


        <!-- Message input section -->
        <footer class="chat-input-area">
            <div class="input-row">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="4000"
                    placeholder="Enter your question..."
                ></textarea>

                <button
                    type="button"
                    id="sendButton"
                >
                    Send
                </button>
            </div>

            <div class="input-help">
                <span>
                    Enter to send, Shift + Enter for a new line
                </span>

                <span id="characterCount">
                    0 / 4000
                </span>
            </div>
        </footer>
    </div>


    <script>
        /*
         * =========================================================
         * 1. Get HTML elements
         * =========================================================
         */

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const newChatButton =
            document.getElementById("newChatButton");

        const chatMessages =
            document.getElementById("chatMessages");

        const characterCount =
            document.getElementById("characterCount");


        /*
         * Store recent conversation messages here.
         *
         * Example:
         *
         * [
         *     {
         *         role: "user",
         *         content: "What is Node.js?"
         *     },
         *     {
         *         role: "assistant",
         *         content: "Node.js is..."
         *     }
         * ]
         */

        let conversationHistory = [];


        /*
         * Prevent multiple requests at the same time.
         */

        let isWaitingForResponse = false;


        /*
         * =========================================================
         * 2. Button and keyboard events
         * =========================================================
         */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /*
         * Press Enter to send.
         * Press Shift + Enter to create a new line.
         */

        messageInput.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {
                    event.preventDefault();
                    sendMessage();
                }
            }
        );


        /*
         * Update character count and textarea height.
         */

        messageInput.addEventListener(
            "input",
            function () {
                updateCharacterCount();
                resizeMessageInput();
            }
        );


        /*
         * Clear the conversation.
         */

        newChatButton.addEventListener(
            "click",
            clearConversation
        );


        /*
         * =========================================================
         * 3. Send message to Node.js API
         * =========================================================
         */

        async function sendMessage() {
            /*
             * Read and clean the user's message.
             */

            const userMessage =
                messageInput.value.trim();


            /*
             * Do nothing if the message is empty.
             */

            if (!userMessage) {
                return;
            }


            /*
             * Do nothing if another request is running.
             */

            if (isWaitingForResponse) {
                return;
            }


            /*
             * Show the user's message.
             */

            addMessage(
                userMessage,
                "user-message"
            );


            /*
             * Clear the input.
             */

            messageInput.value = "";
            updateCharacterCount();
            resizeMessageInput();


            /*
             * Disable input while waiting.
             */

            isWaitingForResponse = true;
            setInputDisabled(true);


            /*
             * Show the typing animation.
             */

            showTypingIndicator();


            try {
                /*
                 * Send a POST request to the backend API.
                 */

                const response = await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: userMessage,
                            history: conversationHistory
                        })
                    }
                );


                /*
                 * Convert the response into JSON.
                 */

                const data = await response.json();


                /*
                 * Remove the typing animation.
                 */

                removeTypingIndicator();


                /*
                 * Check whether the API returned an error.
                 */

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        "The chatbot request failed."
                    );
                }


                /*
                 * Check whether a reply exists.
                 */

                if (!data.reply) {
                    throw new Error(
                        "The AI returned an empty response."
                    );
                }


                /*
                 * Show the bot's answer.
                 */

                addMessage(
                    data.reply,
                    "bot-message"
                );


                /*
                 * Add both messages to conversation history.
                 */

                conversationHistory.push({
                    role: "user",
                    content: userMessage
                });

                conversationHistory.push({
                    role: "assistant",
                    content: data.reply
                });


                /*
                 * Keep only the latest 10 history items.
                 */

                if (
                    conversationHistory.length > 10
                ) {
                    conversationHistory =
                        conversationHistory.slice(-10);
                }

            } catch (error) {
                /*
                 * Remove typing animation if an error occurs.
                 */

                removeTypingIndicator();


                /*
                 * Show a readable error message.
                 */

                addMessage(
                    error.message ||
                    "Unable to connect to the chatbot.",
                    "error-message"
                );


                /*
                 * Print technical error in browser console.
                 */

                console.error(
                    "Chatbot error:",
                    error
                );

            } finally {
                /*
                 * Enable input again.
                 */

                isWaitingForResponse = false;
                setInputDisabled(false);

                messageInput.focus();
            }
        }


        /*
         * =========================================================
         * 4. Add message to screen
         * =========================================================
         */

        function addMessage(
            messageText,
            messageClass
        ) {
            /*
             * Create a new message element.
             */

            const messageElement =
                document.createElement("div");


            /*
             * Add the common and specific CSS classes.
             */

            messageElement.classList.add(
                "message",
                messageClass
            );


            /*
             * Add message using textContent.
             *
             * textContent is safer than innerHTML because it does
             * not execute HTML or JavaScript returned by a user
             * or AI model.
             */

            messageElement.textContent =
                messageText;


            /*
             * Add the message to the chat area.
             */

            chatMessages.appendChild(
                messageElement
            );


            /*
             * Scroll to the newest message.
             */

            scrollToBottom();
        }


        /*
         * =========================================================
         * 5. Typing animation
         * =========================================================
         */

        function showTypingIndicator() {
            const typingMessage =
                document.createElement("div");

            typingMessage.id =
                "typingIndicator";

            typingMessage.classList.add(
                "message",
                "bot-message"
            );


            /*
             * Create the typing container.
             */

            const typingContainer =
                document.createElement("div");

            typingContainer.classList.add(
                "typing-indicator"
            );


            /*
             * Create three animated dots.
             */

            for (
                let dotNumber = 0;
                dotNumber < 3;
                dotNumber++
            ) {
                const dot =
                    document.createElement("span");

                dot.classList.add(
                    "typing-dot"
                );

                typingContainer.appendChild(dot);
            }


            typingMessage.appendChild(
                typingContainer
            );

            chatMessages.appendChild(
                typingMessage
            );

            scrollToBottom();
        }


        function removeTypingIndicator() {
            const typingIndicator =
                document.getElementById(
                    "typingIndicator"
                );

            if (typingIndicator) {
                typingIndicator.remove();
            }
        }


        /*
         * =========================================================
         * 6. Clear conversation
         * =========================================================
         */

        function clearConversation() {
            /*
             * Do not clear while a request is running.
             */

            if (isWaitingForResponse) {
                return;
            }


            /*
             * Remove all conversation history.
             */

            conversationHistory = [];


            /*
             * Remove all displayed messages.
             */

            chatMessages.innerHTML = "";


            /*
             * Add the initial greeting again.
             */

            addMessage(
                "Hello! I am your AI assistant. How can I help you?",
                "bot-message"
            );


            /*
             * Clear and focus the input.
             */

            messageInput.value = "";
            updateCharacterCount();
            resizeMessageInput();
            messageInput.focus();
        }


        /*
         * =========================================================
         * 7. Input control
         * =========================================================
         */

        function setInputDisabled(disabled) {
            messageInput.disabled = disabled;
            sendButton.disabled = disabled;

            if (disabled) {
                sendButton.textContent = "...";
            } else {
                sendButton.textContent = "Send";
            }
        }


        function updateCharacterCount() {
            const currentLength =
                messageInput.value.length;

            characterCount.textContent =
                `${currentLength} / 4000`;
        }


        function resizeMessageInput() {
            /*
             * Reset height before measuring content.
             */

            messageInput.style.height = "auto";


            /*
             * Limit the textarea height to 120 pixels.
             */

            const newHeight =
                Math.min(
                    messageInput.scrollHeight,
                    120
                );

            messageInput.style.height =
                `${newHeight}px`;
        }


        /*
         * =========================================================
         * 8. Scroll to latest message
         * =========================================================
         */

        function scrollToBottom() {
            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: "smooth"
            });
        }
    </script>
</body>
</html>
